<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f5f0">
<title>Жизнь с кошкой</title>
<link rel="stylesheet" href="css/base.css?v=0.9.8">
<link rel="stylesheet" href="css/layout.css?v=0.9.8">
<link rel="stylesheet" href="css/components.css?v=0.9.8">
<link rel="stylesheet" href="css/forms.css?v=0.9.8">
<link rel="stylesheet" href="css/diary.css?v=0.9.8">
<link rel="stylesheet" href="css/avatar.css?v=0.9.8">
<link rel="stylesheet" href="css/ui-fixes-0.9.6.css?v=0.9.8">
<link rel="stylesheet" href="css/task-settings-0.9.2.css?v=0.9.8">
<link rel="stylesheet" href="css/ui-fixes-0.9.9.css?v=0.9.9">
</head>
<body>
<main class="app">
<header class="header">
<div class="logo">Жизнь с кошкой</div>
<div class="header-actions">
<button type="button" id="headerCatAvatar" class="cat-icon header-cat-button" onclick="openModalWithCurrentCat()" aria-label="Открыть профиль кошки">🐈</button>
<button type="button" id="headerMenuButton" class="cat-icon header-menu-button" onclick="toggleHeaderMenu(event)" aria-label="Открыть меню" aria-expanded="false">☰</button>
</div>
<div id="headerMenu" class="header-menu" hidden>
<button type="button" onclick="navigateHeader('home')">🏠 <span>Главная</span></button>
<button type="button" onclick="navigateHeader('diary')">📖 <span>Дневник</span></button>
<button type="button" onclick="navigateHeader('calendar')">📅 <span>Календарь</span></button>
<button type="button" onclick="navigateHeader('achievements')">🏆 <span>Достижения</span></button>
</div>
</header>
<div id="content"></div>
</main>
<div id="modal" class="modal" aria-hidden="true">
<div class="modal-content">
<div class="modal-header"><h2>Профиль кошки</h2><button type="button" class="modal-close" onclick="closeModal()" aria-label="Закрыть">×</button></div>
<form class="form" onsubmit="return saveCat(event);">
<div class="profile-avatar-field"><label class="profile-avatar-picker"><span id="catAvatarPreview" class="profile-avatar-preview">🐈</span><span>Добавить фото</span><input id="catAvatarInput" type="file" accept="image/*" onchange="chooseProfileAvatar(this)"></label></div>
<div class="form-field"><label class="form-label" for="catName">Имя кошки</label><input id="catName" class="input" type="text" placeholder="Например, Микки" autocomplete="off"></div>
<div class="form-field"><label class="form-label" for="catGender">Пол</label><select id="catGender" class="input"><option value="">Не указан</option><option value="Кот">Кот</option><option value="Кошка">Кошка</option></select></div>
<div id="birthDateField" class="form-field"><label class="form-label" for="catBirthDate">Дата рождения</label><input id="catBirthDate" class="input" type="date"><button type="button" class="text-button" onclick="showAgeInput()">Указать возраст вместо даты</button></div>
<div id="ageField" class="age-field" hidden><label class="form-label">Возраст</label><div class="age-row"><input id="catAgeValue" class="input age-input" type="number" min="0" max="40" placeholder="Возраст"><select id="catAgeUnit" class="input age-unit"><option value="years">лет</option><option value="months">месяцев</option></select></div><button type="button" class="text-button" onclick="showBirthDateInput()">Указать дату рождения вместо возраста</button></div>
<div class="form-actions"><button type="submit" class="button">Сохранить</button><button type="button" id="deleteProfileButton" class="delete-profile-button" onclick="deleteCurrentCat()" hidden>Удалить профиль</button><button type="button" class="button button-secondary" onclick="closeModal()">Отмена</button></div>
</form>
</div></div>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<script src="js/utils.js?v=0.9.8"></script>
<script src="js/cats.js?v=0.9.8"></script>
<script src="js/tasks.js?v=0.9.8"></script>
<script src="js/diary.js?v=0.9.8"></script>
<script src="js/calendar.js?v=0.9.8"></script>
<script src="js/health.js?v=0.9.8"></script>
<script src="js/app.js?v=0.9.8"></script>
<script src="js/ui-fixes-0.9.9.js?v=0.9.9"></script>
<script src="js/delete-fix-0.9.9.js?v=0.9.9"></script>
</body>
</html>
