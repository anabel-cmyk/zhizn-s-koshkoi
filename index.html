<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f7f5f0"
    >

    <title>Жизнь с кошкой</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/base.css"
    >

    <link
        rel="stylesheet"
        href="css/layout.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/forms.css"
    >

    <link
        rel="stylesheet"
        href="css/diary.css"
    >

    <link
        rel="stylesheet"
        href="css/task-settings.css"
    >

</head>


<body>

    <main class="app">

        <header class="header">

            <div class="logo">
                Жизнь с кошкой
            </div>

            <div class="cat-icon">
                🐈
            </div>

        </header>


        <div id="content"></div>

    </main>


    <!-- ========================================
         MODAL
         ======================================== -->

    <div
        id="modal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Профиль кошки
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    onclick="closeModal()"
                    aria-label="Закрыть"
                >
                    ×
                </button>

            </div>


            <form
                class="form"
                onsubmit="event.preventDefault(); saveCat();"
            >

                <!-- NAME -->

                <div class="form-field">

                    <label
                        class="form-label"
                        for="catName"
                    >
                        Имя кошки
                    </label>

                    <input
                        id="catName"
                        class="input"
                        type="text"
                        placeholder="Например, Микки"
                        autocomplete="off"
                    >

                </div>


                <!-- BIRTH DATE -->

                <div
                    id="birthDateField"
                    class="form-field"
                >

                    <label
                        class="form-label"
                        for="catBirthDate"
                    >
                        Дата рождения
                    </label>

                    <input
                        id="catBirthDate"
                        class="input"
                        type="date"
                    >

                    <button
                        type="button"
                        class="text-button"
                        onclick="showAgeInput()"
                    >
                        Указать возраст вместо даты
                    </button>

                </div>


                <!-- AGE -->

                <div
                    id="ageField"
                    class="age-field"
                    hidden
                >

                    <label class="form-label">
                        Возраст
                    </label>

                    <div class="age-row">

                        <input
                            id="catAgeValue"
                            class="input age-input"
                            type="number"
                            min="0"
                            max="40"
                            placeholder="Возраст"
                        >

                        <select
                            id="catAgeUnit"
                            class="input age-unit"
                        >

                            <option value="years">
                                лет
                            </option>

                            <option value="months">
                                месяцев
                            </option>

                        </select>

                    </div>


                    <button
                        type="button"
                        class="text-button"
                        onclick="showBirthDateInput()"
                    >
                        Указать дату рождения вместо возраста
                    </button>

                </div>


                <!-- ACTIONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="button"
                    >
                        Сохранить
                    </button> <button
    type="button"
    id="deleteProfileButton"
    class="delete-profile-button"
    onclick="deleteCurrentCat()"
    hidden
>
    Удалить профиль
</button>

                    <button
                        type="button"
                        class="button button-secondary"
                        onclick="closeModal()"
                    >
                        Отмена
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- JS -->

    <script src="js/utils.js"></script>
    <script src="js/cats.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/diary.js"></script>
    <script src="js/app.js"></script>
    <script src="js/task-settings.js"></script>

</body>

</html>
