<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Жизнь с кошкой — спокойный уход за кошкой в одном месте."
    >

    <title>Жизнь с кошкой</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="app">

        <header class="header">

            <div class="logo">
                Жизнь с кошкой
            </div>

            <div class="cat-icon">
                🐈
            </div>

        </header>


        <section id="content"></section>

    </main>


    <!-- МОДАЛЬНОЕ ОКНО ПРОФИЛЯ -->

    <div
        class="modal"
        id="modal"
        aria-hidden="true"
    >

        <div class="modal-content">


            <div class="modal-header">

                <h2>
                    Ваша кошка
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    onclick="closeModal()"
                    aria-label="Закрыть"
                >
                    ×
                </button>

            </div>


            <div class="form">


                <!-- ИМЯ -->

                <div class="form-field">

                    <label
                        for="catName"
                        class="form-label"
                    >
                        Имя кошки
                    </label>

                    <input
                        id="catName"
                        class="input"
                        type="text"
                        placeholder="Например, Микки"
                        autocomplete="off"
                    >

                </div>


                <!-- ДАТА РОЖДЕНИЯ -->

                <div
                    class="form-field"
                    id="birthDateField"
                >

                    <label
                        for="catBirthDate"
                        class="form-label"
                    >
                        Дата рождения
                    </label>

                    <input
                        id="catBirthDate"
                        class="input"
                        type="date"
                    >

                    <button
                        type="button"
                        class="text-button"
                        onclick="showAgeInput()"
                    >
                        Дата рождения неизвестна
                    </button>

                </div>


                <!-- ВОЗРАСТ -->

                <div
                    class="age-field"
                    id="ageField"
                    hidden
                >

                    <label
                        class="form-label"
                    >
                        Возраст
                    </label>


                    <div class="age-row">

                        <input
                            id="catAgeValue"
                            class="input age-input"
                            type="number"
                            min="0"
                            max="30"
                            placeholder="4"
                        >


                        <select
                            id="catAgeUnit"
                            class="input age-unit"
                        >

                            <option value="years">
                                года
                            </option>

                            <option value="months">
                                месяца
                            </option>

                        </select>

                    </div>


                    <button
                        type="button"
                        class="text-button"
                        onclick="showBirthDateInput()"
                    >
                        Указать дату рождения
                    </button>

                </div>


                <!-- КНОПКИ -->

                <div class="form-actions">

                    <button
                        type="button"
                        class="button"
                        onclick="saveCat()"
                    >
                        Сохранить
                    </button>


                    <button
                        type="button"
                        class="button button-secondary"
                        onclick="closeModal()"
                    >
                        Отмена
                    </button>

                </div>


            </div>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
